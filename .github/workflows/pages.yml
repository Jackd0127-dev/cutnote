# Publishes the website in docs/ to GitHub Pages. The launch and tutorial videos are attached to the
# "videos" release and fetched here at build time, so they never sit in the repo (installs stay small).
name: Website
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # only the "videos" release changes the site; app releases are tags the Pages environment won't deploy from,
    # and their run would cancel the push run that does the real deploy
    if: github.event_name != 'release' || github.event.release.tag_name == 'videos'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/media
          gh release download videos -R "$GITHUB_REPOSITORY" -D docs/media -p "cutnote-launch.mp4" -p "cutnote-tutorial.mp4" --clobber
          ls -la docs/media
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
